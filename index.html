<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
    <div class="wrap">
        <h1>To<i>day</i></h1>

        <p class="sub" id="sub">Start adding your tasks below.</p>

        <!-- Type a task and click + or press Enter to add it. -->
        <div class="input-row">
            <input
                type="text"
                id="inp"
                aria-label="New task"
                placeholder="Add a new task..."
                maxlength="100"
            >
            <button type="button" class="add" onclick="add()" aria-label="Add task">+</button>
        </div>

        <!-- These buttons choose which tasks are visible. -->
        <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <!-- JavaScript adds each task, its status dropdown, and its buttons here. -->
        <ul id="list"></ul>

        <p class="empty" id="empty">Nothing here - enjoy the quiet.</p>
    </div>

    <script src="custom.js"></script>
</body>

</html>
